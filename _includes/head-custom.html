<!-- Full-width, dark theme, modern typography, Mermaid (Issue #611) -->
<style>
  html { font-size: 16px; }
  html, body { background: #0f1114; color: #d8dee4; max-width: none; width: 100%; margin: 0; padding: 0; line-height: 1.6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; }
  body > * { margin-left: 0 !important; margin-right: 0 !important; max-width: none !important; width: 100% !important; box-sizing: border-box !important; }
  header, [role="banner"], .header, .site-header, .sidebar, footer:not(.site-footer), .footer, [role="contentinfo"] { display: none !important; }
  main h1 + p { display: none !important; }
  html body .wrapper,
  html body div.wrapper {
    display: block !important;
    max-width: none !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 2rem 2.5rem !important;
    box-sizing: border-box !important;
  }
  html body .wrapper section,
  html body .wrapper > section,
  html body div.wrapper section {
    display: block !important;
    max-width: none !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 0.5rem !important;
    box-sizing: border-box !important;
  }
  main { max-width: none; width: 100%; margin: 0; padding: 0 2.5rem 2rem; }
  .container { max-width: none; width: 100%; }
  [class*="grid"] { grid-template-columns: 1fr !important; }
  html body .wrapper,
  html body .wrapper section,
  html body .wrapper p,
  html body .wrapper strong,
  html body .wrapper section p,
  html body .wrapper section strong { color: #d8dee4 !important; }
  html body .wrapper strong,
  html body .wrapper section strong { color: #e6edf3 !important; }
  html body .wrapper th,
  html body .wrapper section th { color: #e6edf3 !important; background: #21262d !important; }
  html body .wrapper a { color: #58a6ff !important; }
  html body .wrapper a:visited { color: #a371f7 !important; }
  a { color: #58a6ff; }
  a:visited { color: #a371f7; }
  pre, code { background: #21262d; color: #e6edf3; border-radius: 6px; }
  code { padding: 0.2em 0.4em; font-size: 0.9em; }
  pre { padding: 1rem 1.25rem; overflow-x: auto; border-radius: 8px; border: 1px solid #30363d; }
  pre code { padding: 0; background: transparent; }
  table { border-collapse: collapse; width: 100%; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.4); border: 1px solid #30363d; }
  th, td { border: 1px solid #30363d; padding: 0.6rem 0.9rem; text-align: left; }
  th { background: #21262d; color: #e6edf3 !important; font-weight: 600; }
  html body .wrapper th,
  html body .wrapper section th { background: #21262d !important; color: #e6edf3 !important; }
  tbody tr:nth-child(odd) { background: #161b22; }
  tbody tr:nth-child(even) { background: #0d1117; }
  tbody tr:hover { background: #21262d; }
  table code { background: #21262d; color: #e6edf3; border: 1px solid #30363d; }
  h1, h2, h3, h4, h5, h6 { font-weight: 600; letter-spacing: -0.02em; }
  h1 { color: #f0f6fc; font-size: 2rem; margin: 0 0 1rem; padding-bottom: 0.6rem; border-bottom: 1px solid #30363d; }
  h2 { color: #f0f6fc; font-size: 1.4rem; margin: 2rem 0 0.75rem; padding-bottom: 0.4rem; border-bottom: 1px solid #21262d; }
  h3 { color: #e6edf3; font-size: 1.15rem; margin: 1.5rem 0 0.5rem; }
  h4, h5, h6 { color: #e6edf3; font-size: 1rem; margin: 1.25rem 0 0.4rem; }
  html body .wrapper h1,
  html body .wrapper section h1 { color: #f0f6fc !important; }
  html body .wrapper h2,
  html body .wrapper section h2 { color: #f0f6fc !important; }
  html body .wrapper h3,
  html body .wrapper section h3,
  html body .wrapper h4,
  html body .wrapper section h4 { color: #e6edf3 !important; }
  blockquote { border-left: 4px solid #388bfd; margin: 1.25rem 0; padding: 0.5rem 0 0.5rem 1rem; color: #8b949e; background: rgba(56,139,253,0.08); border-radius: 0 6px 6px 0; }
  hr { border: none; border-top: 1px solid #30363d; margin: 2rem 0; }
  ul, ol { margin: 0.75rem 0; padding-left: 1.5rem; }

  .redacted-source-link:hover { color: #8b949e; border-bottom-color: #8b949e; }
</style>
<!-- Mermaid pinned to an exact version with a matching Subresource Integrity
     (SRI) hash so a tampered CDN asset is rejected — supply-chain XSS defence
     (Issue #3169). Bump both the version and the integrity hash together. -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.6/dist/mermaid.min.js"
        integrity="sha384-qX9VvWkP79m/O121ZE6sOYp0nf/pldQgtvWDbkpzi+3mUo4Wn4Ix4cFzNPay3VaB"
        crossorigin="anonymous"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('a[href$=".md"], a[href*=".md#"]').forEach(function (a) {
    var href = a.getAttribute('href');
    if (href && !href.startsWith('http') && !href.startsWith('#')) {
      try {
        var resolved = new URL(href, window.location.href);
        var pathname = resolved.pathname;
        if (pathname.endsWith('.md')) {
          pathname = pathname.slice(0, -3) + '.html';
        } else if (pathname.indexOf('.md#') !== -1) {
          pathname = pathname.replace('.md#', '.html#');
        }
        resolved.pathname = pathname;
        a.setAttribute('href', resolved.href);
      } catch (e) { }
    }
  });
  function slugify(text) {
    return text.replace(/[\u{1F300}-\u{1F9FF}]/gu, '').replace(/[^\w\s-]/g, '').trim().toLowerCase().replace(/[\s_]+/g, '-').replace(/^-+|-+$/g, '') || 'section';
  }
  document.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(function (h) {
    if (!h.id && h.textContent) { h.id = slugify(h.textContent); }
  });
  /* Resolve anchor links: Kramdown gives headings with leading emoji id="-section" (leading hyphen); TOC links use #section */
  function findHeadingById(id) {
    return document.getElementById(id) || document.getElementById('-' + id);
  }
  document.querySelectorAll('a[href^="#"]').forEach(function (a) {
    var hash = a.getAttribute('href');
    if (hash === '#') return;
    var id = hash.slice(1).split('#')[0];
    var target = id && findHeadingById(id);
    if (target) {
      a.setAttribute('href', window.location.pathname + hash);
      a.addEventListener('click', function (e) {
        if (target) { target.scrollIntoView({ behavior: 'smooth', block: 'start' }); e.preventDefault(); }
      });
    }
  });
  /* Scroll to fragment on load (e.g. SECURITY.html#threat-model when id in HTML is "-threat-model") */
  if (window.location.hash) {
    var id = window.location.hash.slice(1).split('#')[0];
    var target = findHeadingById(id);
    if (target) target.scrollIntoView({ behavior: 'auto', block: 'start' });
  }
  mermaid.initialize({
    startOnLoad: false,
    // strict (Mermaid default): escape HTML in labels and disable
    // click/call/href directives. Diagram text on Pages can be steered by
    // untrusted issue/PR content, so loose mode is a stored-XSS vector
    // (Issue #2489).
    securityLevel: 'strict',
    theme: 'base',
    themeVariables: {
      darkMode: true,
      background: '#0f1114',
      primaryColor: '#21262d',
      primaryTextColor: '#e6edf3',
      primaryBorderColor: '#30363d',
      secondaryColor: '#161b22',
      secondaryTextColor: '#d8dee4',
      tertiaryColor: '#0d1117',
      lineColor: '#30363d',
      textColor: '#e6edf3',
      mainBkg: '#21262d',
      nodeBorder: '#30363d',
      clusterBkg: '#161b22',
      clusterBorder: '#30363d',
      titleColor: '#e6edf3',
      edgeLabelBackground: '#21262d',
      nodeTextColor: '#e6edf3',
      fontFamily: 'inherit'
    }
  });
  document.querySelectorAll('pre > code.language-mermaid').forEach(function (code) {
    var pre = code.closest('pre');
    var div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    pre.parentNode.replaceChild(div, pre);
  });
  mermaid.run();
});
</script>
