# Jekyll config for GitHub Pages (https://stsoftwareau.github.io/VibeCoder/)
# baseurl is set at build time via --baseurl from actions/configure-pages
title: VibeCoder
description: Create GitHub issues from your phone, get PRs automatically
theme: jekyll-theme-minimal
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  # false so numbered headings keep prefix in id (e.g. ## 1. Foo -> id="1-foo"), matching TOC links
  auto_id_stripping: false

# Doc pages at /path/name.html so links can point to .html and resolve.
permalink: /:path/:basename.html

# Use the same layout for all pages.
defaults:
  - scope:
      path: ""
      type: page
    values:
      layout: default

# Only publish docs and root-level docs; exclude code and scripts.
# README.md is included so it is built as README.html; 404.html redirects README.md → README.html for doc links.
# docs/archive/ holds historical pr-summary files that often discuss Liquid
# syntax in prose; they're worker-readable artefacts (see
# worker/deno/lib/pr_summary_loader.ts) and not linked from the published
# site, so we keep them out of the Jekyll build to avoid Liquid parse errors.
exclude:
  - worker
  - tests
  - setup
  - prompts
  - hooks
  - docs/archive
  # Worker-generated handover notes left on interrupted issue branches
  # (Issue #769). They are resume state for the next claim, not site content.
  - docs/handover
  - .git
  - .github
  - .cursor
  - node_modules
  - vendor
  - .bundle
  - "*.sh"
  - Gemfile
  - Gemfile.lock
  - .config.json
