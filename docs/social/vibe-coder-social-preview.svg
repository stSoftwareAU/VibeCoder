<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Vibe Coder social preview">
  <defs>
    <linearGradient id="bodyGrad" x1="18%" y1="8%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="30%" y1="20%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Decorative side brackets - logo only, no text -->
  <g transform="translate(180 320)" filter="url(#softGlow)">
    <path d="M0,120 C-40,40 -30,-80 40,-140" fill="none" stroke="#1e1035" stroke-width="34" stroke-linecap="round"/>
    <path d="M0,120 C-40,40 -30,-80 40,-140" fill="none" stroke="#f5e9ff" stroke-width="20" stroke-linecap="round"/>
    <path d="M0,120 C-40,40 -30,-80 40,-140" fill="none" stroke="#a855f7" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g transform="translate(1100 320)" filter="url(#softGlow)">
    <path d="M0,120 C40,40 30,-80 -40,-140" fill="none" stroke="#1e1035" stroke-width="34" stroke-linecap="round"/>
    <path d="M0,120 C40,40 30,-80 -40,-140" fill="none" stroke="#f5e9ff" stroke-width="20" stroke-linecap="round"/>
    <path d="M0,120 C40,40 30,-80 -40,-140" fill="none" stroke="#22d3ee" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Centered mascot -->
  <g transform="translate(640 360) scale(0.72)">
    <line x1="-70" y1="-250" x2="-110" y2="-340" stroke="#1e1035" stroke-width="26" stroke-linecap="round"/>
    <line x1="-70" y1="-250" x2="-110" y2="-340" stroke="#f5e9ff" stroke-width="14" stroke-linecap="round"/>
    <line x1="-70" y1="-250" x2="-110" y2="-340" stroke="#7c3aed" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-110" cy="-340" r="22" fill="#1e1035"/>
    <circle cx="-110" cy="-340" r="16" fill="#f5e9ff"/>
    <circle cx="-110" cy="-340" r="12" fill="#22d3ee" filter="url(#softGlow)"/>

    <line x1="70" y1="-250" x2="110" y2="-340" stroke="#1e1035" stroke-width="26" stroke-linecap="round"/>
    <line x1="70" y1="-250" x2="110" y2="-340" stroke="#f5e9ff" stroke-width="14" stroke-linecap="round"/>
    <line x1="70" y1="-250" x2="110" y2="-340" stroke="#7c3aed" stroke-width="8" stroke-linecap="round"/>
    <circle cx="110" cy="-340" r="22" fill="#1e1035"/>
    <circle cx="110" cy="-340" r="16" fill="#f5e9ff"/>
    <circle cx="110" cy="-340" r="12" fill="#e879f9" filter="url(#softGlow)"/>

    <ellipse cx="0" cy="-40" rx="210" ry="230" fill="#1e1035"/>
    <ellipse cx="0" cy="-40" rx="198" ry="218" fill="#f5e9ff"/>
    <ellipse cx="0" cy="-40" rx="186" ry="206" fill="url(#bodyGrad)"/>

    <ellipse cx="0" cy="-55" rx="130" ry="110" fill="#1e1035"/>
    <ellipse cx="0" cy="-55" rx="120" ry="100" fill="url(#faceGrad)"/>

    <ellipse cx="-48" cy="-70" rx="28" ry="34" fill="#1e1035"/>
    <ellipse cx="48" cy="-70" rx="28" ry="34" fill="#1e1035"/>
    <ellipse cx="-48" cy="-70" rx="20" ry="26" fill="#22d3ee"/>
    <ellipse cx="48" cy="-70" rx="20" ry="26" fill="#22d3ee"/>
    <circle cx="-42" cy="-78" r="7" fill="#ffffff"/>
    <circle cx="54" cy="-78" r="7" fill="#ffffff"/>

    <path d="M-40,-20 Q0,18 40,-20" fill="none" stroke="#1e1035" stroke-width="12" stroke-linecap="round"/>
    <path d="M-40,-20 Q0,18 40,-20" fill="none" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>

    <circle cx="-88" cy="-30" r="12" fill="#f0abfc" opacity="0.85"/>
    <circle cx="88" cy="-30" r="12" fill="#f0abfc" opacity="0.85"/>

    <g transform="translate(0 120)">
      <circle cx="0" cy="0" r="48" fill="#1e1035"/>
      <circle cx="0" cy="0" r="40" fill="#f5e9ff"/>
      <circle cx="0" cy="0" r="34" fill="url(#accentGrad)"/>
      <path d="M0,-18 L6,-2 L22,0 L6,2 L0,18 L-6,2 L-22,0 L-6,-2 Z" fill="#ffffff"/>
    </g>

    <ellipse cx="-175" cy="40" rx="36" ry="70" transform="rotate(-25 -175 40)" fill="#1e1035"/>
    <ellipse cx="-175" cy="40" rx="28" ry="60" transform="rotate(-25 -175 40)" fill="#f5e9ff"/>
    <ellipse cx="-175" cy="40" rx="22" ry="52" transform="rotate(-25 -175 40)" fill="#8b5cf6"/>
    <ellipse cx="175" cy="40" rx="36" ry="70" transform="rotate(25 175 40)" fill="#1e1035"/>
    <ellipse cx="175" cy="40" rx="28" ry="60" transform="rotate(25 175 40)" fill="#f5e9ff"/>
    <ellipse cx="175" cy="40" rx="22" ry="52" transform="rotate(25 175 40)" fill="#8b5cf6"/>

    <g fill="#f5e9ff" stroke="#1e1035" stroke-width="4">
      <path d="M-250,-180 l6,14 14,6 -14,6 -6,14 -6,-14 -14,-6 14,-6 z"/>
      <path d="M250,-200 l5,12 12,5 -12,5 -5,12 -5,-12 -12,-5 12,-5 z"/>
    </g>
    <g fill="#22d3ee">
      <path d="M-250,-180 l4,10 10,4 -10,4 -4,10 -4,-10 -10,-4 10,-4 z"/>
      <path d="M250,-200 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 z"/>
    </g>
