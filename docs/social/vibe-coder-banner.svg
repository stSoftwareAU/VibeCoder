<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-label="Vibe Coder banner">
  <defs>
    <linearGradient id="bodyGrad" x1="18%" y1="8%" x2="82%" y2="92%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="30%" y1="20%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Wide decorative arcs / brackets -->
  <g transform="translate(160 250)" filter="url(#softGlow)">
    <path d="M0,110 C-50,20 -20,-120 70,-170" fill="none" stroke="#1e1035" stroke-width="30" stroke-linecap="round"/>
    <path d="M0,110 C-50,20 -20,-120 70,-170" fill="none" stroke="#f5e9ff" stroke-width="18" stroke-linecap="round"/>
    <path d="M0,110 C-50,20 -20,-120 70,-170" fill="none" stroke="#a855f7" stroke-width="9" stroke-linecap="round"/>
  </g>
  <g transform="translate(1340 250)" filter="url(#softGlow)">
    <path d="M0,110 C50,20 20,-120 -70,-170" fill="none" stroke="#1e1035" stroke-width="30" stroke-linecap="round"/>
    <path d="M0,110 C50,20 20,-120 -70,-170" fill="none" stroke="#f5e9ff" stroke-width="18" stroke-linecap="round"/>
    <path d="M0,110 C50,20 20,-120 -70,-170" fill="none" stroke="#22d3ee" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Side sparkles -->
  <g fill="#f5e9ff" stroke="#1e1035" stroke-width="3">
    <path d="M280,120 l5,12 12,5 -12,5 -5,12 -5,-12 -12,-5 12,-5 z"/>
    <path d="M1220,360 l5,12 12,5 -12,5 -5,12 -5,-12 -12,-5 12,-5 z"/>
    <path d="M320,380 l4,10 10,4 -10,4 -4,10 -4,-10 -10,-4 10,-4 z"/>
    <path d="M1180,110 l4,10 10,4 -10,4 -4,10 -4,-10 -10,-4 10,-4 z"/>
  </g>
  <g fill="#22d3ee">
    <path d="M280,120 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 z"/>
    <path d="M1220,360 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 z"/>
  </g>
  <g fill="#e879f9">
    <path d="M320,380 l3,7 7,3 -7,3 -3,7 -3,-7 -7,-3 7,-3 z"/>
    <path d="M1180,110 l3,7 7,3 -7,3 -3,7 -3,-7 -7,-3 7,-3 z"/>
  </g>

  <!-- Centered mascot (scaled for banner height) -->
  <g transform="translate(750 275) scale(0.55)">
    <line x1="-70" y1="-250" x2="-110" y2="-340" stroke="#1e1035" stroke-width="26" stroke-linecap="round"/>
    <line x1="-70" y1="-250" x2="-110" y2="-340" stroke="#f5e9ff" stroke-width="14" stroke-linecap="round"/>
    <line x1="-70" y1="-250" x2="-110" y2="-340" stroke="#7c3aed" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-110" cy="-340" r="22" fill="#1e1035"/>
    <circle cx="-110" cy="-340" r="16" fill="#f5e9ff"/>
    <circle cx="-110" cy="-340" r="12" fill="#22d3ee" filter="url(#softGlow)"/>

    <line x1="70" y1="-250" x2="110" y2="-340" stroke="#1e1035" stroke-width="26" stroke-linecap="round"/>
    <line x1="70" y1="-250" x2="110" y2="-340" stroke="#f5e9ff" stroke-width="14" stroke-linecap="round"/>
    <line x1="70" y1="-250" x2="110" y2="-340" stroke="#7c3aed" stroke-width="8" stroke-linecap="round"/>
    <circle cx="110" cy="-340" r="22" fill="#1e1035"/>
    <circle cx="110" cy="-340" r="16" fill="#f5e9ff"/>
    <circle cx="110" cy="-340" r="12" fill="#e879f9" filter="url(#softGlow)"/>

    <ellipse cx="0" cy="-40" rx="210" ry="230" fill="#1e1035"/>
    <ellipse cx="0" cy="-40" rx="198" ry="218" fill="#f5e9ff"/>
    <ellipse cx="0" cy="-40" rx="186" ry="206" fill="url(#bodyGrad)"/>

    <ellipse cx="0" cy="-55" rx="130" ry="110" fill="#1e1035"/>
    <ellipse cx="0" cy="-55" rx="120" ry="100" fill="url(#faceGrad)"/>

    <ellipse cx="-48" cy="-70" rx="28" ry="34" fill="#1e1035"/>
    <ellipse cx="48" cy="-70" rx="28" ry="34" fill="#1e1035"/>
    <ellipse cx="-48" cy="-70" rx="20" ry="26" fill="#22d3ee"/>
    <ellipse cx="48" cy="-70" rx="20" ry="26" fill="#22d3ee"/>
    <circle cx="-42" cy="-78" r="7" fill="#ffffff"/>
    <circle cx="54" cy="-78" r="7" fill="#ffffff"/>

    <path d="M-40,-20 Q0,18 40,-20" fill="none" stroke="#1e1035" stroke-width="12" stroke-linecap="round"/>
    <path d="M-40,-20 Q0,18 40,-20" fill="none" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>

    <circle cx="-88" cy="-30" r="12" fill="#f0abfc" opacity="0.85"/>
    <circle cx="88" cy="-30" r="12" fill="#f0abfc" opacity="0.85"/>

    <g transform="translate(0 120)">
      <circle cx="0" cy="0" r="48" fill="#1e1035"/>
      <circle cx="0" cy="0" r="40" fill="#f5e9ff"/>
      <circle cx="0" cy="0" r="34" fill="url(#accentGrad)"/>
      <path d="M0,-18 L6,-2 L22,0 L6,2 L0,18 L-6,2 L-22,0 L-6,-2 Z" fill="#ffffff"/>
    </g>

    <ellipse cx="-175" cy="40" rx="36" ry="70" transform="rotate(-25 -175 40)" fill="#1e1035"/>
    <ellipse cx="-175" cy="40" rx="28" ry="60" transform="rotate(-25 -175 40)" fill="#f5e9ff"/>
    <ellipse cx="-175" cy="40" rx="22" ry="52" transform="rotate(-25 -175 40)" fill="#8b5cf6"/>
    <ellipse cx="175" cy="40" rx="36" ry="70" transform="rotate(25 175 40)" fill="#1e1035"/>
    <ellipse cx="175" cy="40" rx="28" ry="60" transform="rotate(25 175 40)" fill="#f5e9ff"/>
    <ellipse cx="175" cy="40" rx="22" ry="52" transform="rotate(25 175 40)" fill="#8b5cf6"/>
  </g>
</svg>
