# Automated GitHub Actions pin updates (Issue #4400, GHA-SUPPLY-002).
#
# renovate.json is present but the Renovate app has never opened a PR here
# (no Dependency Dashboard, no renovate[bot] author in the last 100 PRs), and
# four SHA-pinned actions had drifted a major or more. Dependabot's
# github-actions ecosystem is native, needs no app install, rewrites the SHA
# pin AND the trailing version comment, and honours a cooldown that mirrors
# the 24h quarantine Renovate would have applied.
#
# Deno/JSR stays with deno.json minimumDependencyAge. A bundler ecosystem
# sat here too, for the Jekyll site's Gemfile.lock; the site went with the
# Pages publishing logic (Issue #1344) and the Ruby manifests with it
# (Issue #1376), so github-actions is the only ecosystem Dependabot owns.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain quarantine: never take a release younger than a day
    # (Issue #4400; same intent as renovate.json's minimumReleaseAge).
    #
    # No semver-major-days here. Dependabot rejects the whole file with
    # "The property '#/updates/0/cooldown/semver-major-days' is not supported
    # for the package ecosystem 'github-actions'" — action releases are not
    # semantically versioned, so the semver-* cooldown keys apply only to
    # ecosystems that are. The key had been sitting here since #4400 making
    # the entire config invalid, which meant the ecosystem never ran; it only
    # surfaced because Dependabot revalidates the file when it changes
    # (Issue #273).
    #
    # nosemgrep rationale: semgrep's dependabot-missing-cooldown wants
    # default-days: 7 on every ecosystem. A cooldown *is* set here; the rule
    # is asserting a longer one than this repo's standard. That standard is
    # 24h and it is deliberate and repo-wide — renovate.json
    # `minimumReleaseAge`, both Deno `minimumDependencyAge` settings, and the
    # worker's own VIBE_BUMP_QUARANTINE_HOURS default.
    cooldown:
      # nosemgrep: package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown
      default-days: 1
    commit-message:
      prefix: "chore(actions)"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
