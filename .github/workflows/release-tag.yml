name: Release Tag

# Third-party actions are pinned to 40-character commit SHAs (Issue
# #2123) so a hijacked tag cannot inject code into the workflow. The
# version tag each SHA corresponds to is captured in a leading
# comment for human readability.

# Issue #627 — push to `main` only. A frozen host pins to a released
# version, so every merge that reaches `main` has to leave a tag behind;
# the merge commit only exists post-merge, so `push` is the one trigger
# that can see it. This is a publish workflow, not a required check, so
# it deliberately keeps firing on push where the gates
# (`validate-scripts.yml`) are pull-request only — see docs/MERGE.md.
#
# Nothing downstream waits on this run: the merge has already landed, and
# a failed tag shows as a red run here and a missing tag on the commit,
# never as a blocked merge.
on:
  push:
    branches: [main]

# Issue #2382 — Rule of Two: minimise workflow token capability. The
# workflow default stays read-only; the single `contents: write` grant the
# tag creation needs is scoped to the job below, and nothing else is
# granted.
permissions:
  contents: read

# Issue #627 — serialise, never cancel. Two merges landing together would
# otherwise both read the same newest tag and race to mint the same
# number; the second run has to see the first run's tag. `main` is the
# only ref this fires on, so one group covers it.
concurrency:
  group: release-tag-main
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The whole capability of this workflow: create one tag ref, and publish
    # the release that carries its tool-version manifest (Issue #688).
    permissions:
      contents: write
    env:
      # Issue #606: opt into Node.js 24 to avoid deprecation warnings for
      # actions still bundled with Node.js 20 (e.g. denoland/setup-deno).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The full tag set is the input to the version selection — a
          # shallow clone would hide the newest release tag and the run
          # would mint a version that already exists.
          fetch-depth: 0
          # Issue #4395: no git credentials are persisted in the checkout.
          # The tag is created through the API with the job token instead.
          persist-credentials: false

      - name: Work out the next release tag
        id: plan
        run: |
          set -euo pipefail
          git tag --list > all-tags.txt
          git tag --points-at "${GITHUB_SHA}" > head-tags.txt
          # Issue #808: `.release-floor` is the one line a human edits to move
          # the series. The script mints the higher of that floor and the
          # automatic patch increment, so the file is inert once the release
          # it names exists.
          .github/scripts/next-release-tag.sh \
            all-tags.txt head-tags.txt .release-floor |
            tee -a "${GITHUB_OUTPUT}"

      - name: Create the tag
        if: steps.plan.outputs.should_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Read through the environment, never interpolated into the
          # script body — a `${{ }}` expansion inside `run:` is the
          # template-injection shape.
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG}" \
            -f "sha=${GITHUB_SHA}" \
            --silent
          echo "Tagged ${GITHUB_SHA} as ${TAG}"

      # Issue #688 — everything below records what the release ships with. The
      # tag above stays this workflow's first side effect: a failed manifest is
      # a red run and a release without an asset, never a rolled-back tag.
      # `plan.outputs.tag` names the commit's release whether this run minted
      # it or a previous run did, so a re-run after a failed publish recovers.
      - name: Install Deno (mints the release tool-version manifest)
        if: steps.plan.outputs.tag != ''
        # denoland/setup-deno@v2.0.5
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          # The repo's single source of truth for the toolchain, never a
          # floating range resolved at run time (Issue #4403).
          deno-version-file: .deno-version

      - name: Publish the release tool-version manifest
        if: steps.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # Read through the environment, never interpolated into the script
          # body — a `${{ }}` expansion inside `run:` is the template-injection
          # shape.
          TAG: ${{ steps.plan.outputs.tag }}
          ASSET: tool-versions.json
        run: |
          set -euo pipefail

          # Idempotent: a release already carrying the asset is left alone, so
          # re-running the workflow publishes nothing twice.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
               --json assets --jq '.assets[].name' 2>/dev/null |
               grep -qx "${ASSET}"; then
            echo "${TAG} already carries ${ASSET} — nothing to publish"
            exit 0
          fi

          # All-or-nothing: a tool the release-age gate cannot resolve exits
          # non-zero here, naming that tool, and nothing is published. A
          # manifest missing a version would let a host silently drift on
          # whichever tool it left out (Issue #622).
          deno run --frozen --lock=worker/deno/deno.lock \
            --allow-net --allow-run --allow-env --allow-read \
            worker/deno/mod.ts release-manifest --release "${TAG}" \
            > "${RUNNER_TEMP}/${ASSET}" < /dev/null

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
               >/dev/null 2>&1; then
            gh release upload "${TAG}" "${RUNNER_TEMP}/${ASSET}" \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            # --verify-tag: publish against the tag that exists, never mint a
            # new one from a name that does not.
            # Issue #808: point at the release notes for the tag being
            # published, so a release that moves the series carries its
            # migration steps rather than only its tool versions.
            gh release create "${TAG}" "${RUNNER_TEMP}/${ASSET}" \
              --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --verify-tag \
              --notes "Tool versions this release ships with are attached as ${ASSET}.

          Release notes: https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/RELEASE-NOTES.md"
          fi
          echo "Published ${ASSET} on the ${TAG} release"
