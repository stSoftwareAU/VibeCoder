name: Gitleaks

# Detect secrets in pull request diffs.
#
# Issue #5436: every scan runs the one pinned, checksum-verified gitleaks
# CLI. The licensed gitleaks-action was dropped because it scanned only the
# first 30 commits a PR lists (PR #5322 passed with 21 of its 51 commits
# unscanned) and bundled its own gitleaks 8.24.3. The PR job scans (1) every
# commit in base..head, whatever the count, then (2) the merged result
# (refs/pull/N/merge) against its first parent, the diff a squash merge
# lands, so a secret that only exists once the commits are combined (for
# example in a merge resolution) is still caught.
#
# Third-party actions are pinned to 40-character commit SHAs (Issue #1756) so
# a hijacked tag cannot exfiltrate CI secrets.

on:
  # Called by quality.yml, whose `gate` job is the one required check: on a
  # pull request this workflow runs once, through that call. The branch
  # filter it used to carry (Develop, main, milestone/* — Issues #3360,
  # #3940) is quality.yml's now.
  workflow_call:
  # Issue #4190 — the PR job above only ever sees a commit range, so a
  # credential that leaked into an old commit on a dead branch (or into a
  # tag) is never re-examined. The weekly full-history sweep below scans
  # every ref with both scanners so the audit cannot decay.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Issue #2972: cancel superseded PR runs. Only the latest commit's
# result matters for a PR check, so a per-ref group with cancellation
# stops rapid pushes spawning parallel, redundant runs.
# No concurrency group here: as a called workflow this file inherits its
# caller's `github.workflow`, so a group of its own would cancel its
# siblings. quality.yml holds the one group.

jobs:
  gitleaks:
    # PR-diff scan only — the scheduled sweep is the job below.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Repo gitleaks config (extends the default rule set). It lives under
      # .github/ because the repo .gitignore forbids committing root-level
      # hidden files such as .gitleaks.toml (Issue #1751). Both scans read it
      # so their allowlists match — it scopes out the deliberately-fake PEM
      # fixtures in the secret-redaction unit test (Issue #3203).
      GITLEAKS_CONFIG: ${{ github.workspace }}/.github/gitleaks.toml
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Full history, so both ends of base..head resolve. On a pull
          # request checkout leaves HEAD at refs/pull/N/merge, the merged
          # result the last step scans.
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          # Pinned by version and verified against a published SHA-256
          # checksum so a tampered release cannot run in CI.
          mkdir -p "$RUNNER_TEMP/bin"
          gl="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$gl" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${gl}"
          echo "${GITLEAKS_SHA256}  ${gl}" | sha256sum -c -
          tar -xzf "$gl" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan every commit in the pull request (base..head)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::error::commit ${sha} is not in the checkout, so ${BASE_SHA}..${HEAD_SHA} cannot be scanned"
              exit 1
            fi
          done
          count="$(git rev-list --count "${BASE_SHA}..${HEAD_SHA}")"
          echo "Scanning ${count} commit(s): ${BASE_SHA}..${HEAD_SHA}"
          gitleaks git --config "${GITLEAKS_CONFIG}" \
            --redact --no-banner --exit-code 1 \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" .
      - name: Scan the merged result (refs/pull/N/merge)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merge_sha="$(git rev-parse HEAD)"
          if ! second_parent="$(git rev-parse --verify --quiet "${merge_sha}^2")" \
            || [ "$second_parent" != "$HEAD_SHA" ]; then
            echo "::error::HEAD ${merge_sha} is not the merge of the PR head ${HEAD_SHA}, so the merged result cannot be scanned"
            exit 1
          fi
          base_tip="$(git rev-parse "${merge_sha}^1")"
          echo "Scanning the merged result: ${base_tip}..${merge_sha}"
          # --first-parent diffs the merge against the base tip, the diff a
          # squash merge lands. `-1 -p <merge>` alone shows no diff for a
          # merge commit and scans nothing.
          gitleaks git --config "${GITLEAKS_CONFIG}" \
            --redact --no-banner --exit-code 1 \
            --log-opts="--first-parent --diff-merges=first-parent -1 ${merge_sha}" .

  # Issue #4190 — audited, re-runnable full-history sweep. Runs both
  # scanners over every ref (`--log-opts=--all` covers branches and tags)
  # and classifies each finding against the committed baseline. Fails
  # while any finding is unbaselined or any confirmed leak is unrotated.
  full-history:
    name: Full-history secrets sweep (gitleaks + trufflehog)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Issue #606: opt into Node.js 24 to avoid deprecation warnings for
      # actions still bundled with Node.js 20 (e.g. denoland/setup-deno).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Every commit on every ref — a shallow or single-branch clone
          # would silently narrow the sweep.
          fetch-depth: 0

      - name: Fetch every ref
        run: |
          set -euo pipefail
          # actions/checkout leaves only the checked-out branch locally, so
          # fetch the rest before scanning; without this the sweep reports a
          # clean history it never looked at.
          git fetch --no-tags --prune --force origin \
            "+refs/heads/*:refs/remotes/origin/*"
          git fetch --tags --force origin
          git for-each-ref --format='%(refname)' | wc -l

      - name: Install deno
        # denoland/setup-deno@v2.0.5
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version-file: .deno-version

      # Issue #2619: warm the Deno module cache across runs, as the validate job does.
      - name: Cache Deno modules
        # actions/cache@v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('worker/deno/deno.lock') }}
          # Exact key only, no restore-keys (Issue #4404, GHA-SUPPLY-010).

      - name: Install scanners
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          TRUFFLEHOG_VERSION: "3.97.0"
          TRUFFLEHOG_SHA256: "62224de2f9dd7cd418800feb953760a302ed2f82a7c547fe1146a4874fb179e4"
        run: |
          set -euo pipefail
          # Both CLIs are pinned by version and verified against a published
          # SHA-256 checksum so a tampered release cannot run in CI.
          mkdir -p "$RUNNER_TEMP/bin"
          gl="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$gl" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${gl}"
          echo "${GITLEAKS_SHA256}  ${gl}" | sha256sum -c -
          tar -xzf "$gl" -C "$RUNNER_TEMP/bin" gitleaks
          th="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$th" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/${th}"
          echo "${TRUFFLEHOG_SHA256}  ${th}" | sha256sum -c -
          tar -xzf "$th" -C "$RUNNER_TEMP/bin" trufflehog
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Full-history secrets scan
        run: |
          set -euo pipefail
          # The same command an operator runs locally, so CI and the desk
          # can never disagree about what was swept.
          deno run --frozen --lock=worker/deno/deno.lock \
            --allow-read --allow-write --allow-run --allow-env \
            worker/deno/mod.ts secrets-history-scan \
            --report "$RUNNER_TEMP/secrets-full-history-scan.md" \
            < /dev/null

      - name: Publish the report to the job summary
        if: always()
        run: |
          set -euo pipefail
          # The report carries locations and rule names only — never a
          # secret value — so it is safe in the run summary.
          if [ -f "$RUNNER_TEMP/secrets-full-history-scan.md" ]; then
            cat "$RUNNER_TEMP/secrets-full-history-scan.md" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced — the scan failed before writing one." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
