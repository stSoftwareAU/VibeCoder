name: Markdown Lint

# CI counterpart of the local `markdownlint` quality gate stage
# (Issue #1685). Runs on every PR so structural Markdown defects (broken
# heading hierarchies, malformed tables, missing-space ATX headings,
# empty links) are caught before they ship.
#
# Third-party actions are pinned to commit SHAs (Issue #1686) so a
# hijacked tag cannot inject code into the workflow. The version tag
# the SHA corresponds to is captured in a comment alongside each
# `uses:` line for human readability.
#
# Configuration lives in `.markdownlint-cli2.jsonc` at the repo root —
# single source of truth shared with the local `quality.sh` run.

# Issue #3332 — pull-request only. `markdownlint` is a required status check,
# so every change reaches `Develop` through a PR this workflow has already
# gated; re-running it on the post-merge push duplicated that run with no
# enforcement value (see docs/MERGE.md — "No post-merge re-run of required
# checks"). Deploy/publish workflows are different and keep firing on push.
on:
  pull_request:
    # Issue #3940 — this was `["*"]`, which reads as "every branch" but a
    # GitHub `*` never matches `/`, so the Markdown gate never ran on
    # milestone sub-issue PRs. Those PRs target a shared `milestone/<name>`
    # branch (Issue #1300) and are the dominant merge path, so the glob is
    # listed explicitly (Issue #3360).
    branches: [Develop, main, milestone/*]

permissions:
  contents: read

# Issue #2972: cancel superseded PR runs. Only the latest commit's
# result matters for a check, so a per-ref group with cancellation
# stops rapid pushes spawning parallel, redundant runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v7.0.1 — Node 24 runtime (Issue #2319)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node@v7.0.0 — Node 24 runtime (Issue #2317);
      # v4 ran on Node 20, deprecated for forced upgrade 2026-06-02 and
      # full removal 2026-09-16.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          # Issue #4403 (GHA-SUPPLY-019): exact Node from .node-version (tied to the
          # container image's NODE_VERSION by test), not a floating channel.
          node-version-file: .node-version
      # Issue #3642: pinned to an exact version so the install sits inside
      # the 24h dependency quarantine (the `renovate.json` custom manager
      # bumps this pin under `minimumReleaseAge`), and `--ignore-scripts`
      # keeps install-time lifecycle scripts from the dependency tree off
      # the runner.
      - name: Install markdownlint-cli2
        run: npm install -g --ignore-scripts markdownlint-cli2@0.23.2
      - name: Run markdownlint-cli2
        run: markdownlint-cli2
      # Optional: mirror the local check-mermaid quality gate when Deno
      # and the worker module are available in the repo (Issue #1683).
      - name: Detect Deno worker module
        id: detect-deno
        run: |
          set -euo pipefail
          if [ -f worker/deno/mod.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # denoland/setup-deno@v2.0.5
      - if: steps.detect-deno.outputs.present == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          # Issue #4403 (GHA-SUPPLY-019): exact toolchain from the repo's single source of
          # truth (.deno-version, tied to the container image's Deno by test), never a
          # floating range resolved at run time.
          deno-version-file: .deno-version
      - if: steps.detect-deno.outputs.present == 'true'
        name: Validate Mermaid blocks
        run: deno run --frozen --lock=worker/deno/deno.lock --allow-read --allow-env=DEBUG,LOG_LEVEL,CONFIG_FILE,CONFIG_PATH,OUTPUT_JSON worker/deno/mod.ts check-mermaid
      # Issue #4191: the published threat model cites a file path for every
      # control and every attack path. A rename that leaves those citations
      # dangling must fail here, not sit unnoticed in a document that still
      # reads as if the control exists. Also checks the document's in-repo
      # links and heading anchors.
      - if: steps.detect-deno.outputs.present == 'true'
        name: Validate threat-model links and traceability
        run: deno test --frozen --lock=worker/deno/deno.lock --config worker/deno/deno.json --allow-read worker/deno/tests/threat_model_docs_test.ts
