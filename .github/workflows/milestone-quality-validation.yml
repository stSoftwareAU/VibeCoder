name: Milestone Quality Validation

on:
  push:
    branches: [codex/milestone121-validation]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the immutable milestone source tree
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c081a90d81800fea2b9a9a02c103efc135c4e27f
          persist-credentials: false
          fetch-depth: 0

      - name: Set the fetched default branch for changed-file checks
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/remotes/origin/${DEFAULT_BRANCH}"
          git symbolic-ref refs/remotes/origin/HEAD "refs/remotes/origin/${DEFAULT_BRANCH}"

      - name: Install pinned Deno
        # denoland/setup-deno@v2.0.5
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version-file: .deno-version

      - name: Install pinned Node
        # actions/setup-node@v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version

      - name: Install the existing pinned Markdown linter
        # zizmor: ignore[adhoc-packages] -- identical exact pin and --ignore-scripts used by markdown-lint.yml; this temporary validation workflow is excluded from the source tree under test.
        run: npm install -g --ignore-scripts markdownlint-cli2@0.23.2

      - name: Fetch the existing CI-pinned Semgrep image
        run: docker pull semgrep/semgrep:1.173.0@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a

      - name: Run the unchanged full repository quality gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./quality.sh < /dev/null 2>&1 | tee /tmp/milestone-quality.log

      - name: Retain quality evidence
        if: always()
        # actions/upload-artifact@v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: milestone-quality-evidence
          path: /tmp/milestone-quality.log
          if-no-files-found: warn
          retention-days: 7
