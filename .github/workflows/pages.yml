# Build and deploy README + docs to GitHub Pages (https://stsoftwareau.github.io/VibeCoder/)
# See: https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site#publishing-with-a-custom-github-actions-workflow
# Issue #611
#
# Third-party actions are pinned to 40-character commit SHAs (Issue
# #2123) so a hijacked tag cannot exfiltrate the OIDC token granted
# by `id-token: write` or alter the published Pages build. The
# version tag each SHA corresponds to is captured in a leading
# comment for human readability.

name: Deploy docs to GitHub Pages

on:
  push:
    branches: [Develop]
    paths:
      - "README.md"
      - "SECURITY.md"
      - "AGENTS.md"
      - "docs/**"
      - "_config.yml"
      - "_data/**"
      - "_includes/**"
      - "_layouts/**"
      - "Gemfile"
      - ".github/workflows/pages.yml"
      - ".github/scripts/**"
  workflow_dispatch:

# Issue #2969: scope the OIDC-mint (`id-token: write`) and `pages: write`
# grants to the single `deploy` job that publishes. The workflow-level
# default is read-only `contents`, so the `build` job — which runs
# third-party gem code and `.github/scripts/*.rb` — cannot mint the OIDC
# token (over-broad-OIDC-grant class, tj-actions incident). Only `deploy`,
# which calls `actions/deploy-pages`, holds the publishing capability.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Issue #3025: `configure-pages` (Setup Pages) calls
    # `GET /repos/{owner}/{repo}/pages` to read the site config, which needs
    # the `pages` scope. The workflow-level default is `contents: read` only,
    # so without this block the step fails with 403 "Resource not accessible
    # by integration". Grant read-only `pages` here — deliberately NOT
    # `pages: write`/`id-token: write`, preserving the Issue #2969 hardening
    # that scopes publish + OIDC-mint to the `deploy` job alone.
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use README as site index
        run: |
          set -euo pipefail
          (echo "---"; echo "layout: default"; echo "---"; echo "") > index.md
          cat README.md >> index.md

      - name: Setup Ruby
        # ruby/setup-ruby@v1.310.0
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        # actions/configure-pages@v6.0.0
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      # Inject layout, per-page title, and optional page_icon (from _data/page_titles.yml) so browser tab shows e.g. "📚 Lessons learnt"
      - name: Inject layout and page titles for docs and root .md
        run: ruby .github/scripts/inject_page_metadata.rb

      - name: Build with Jekyll
        # The Pages base path reaches the shell through an env var, never by
        # template expansion inside `run:` (zizmor template-injection, #4399).
        run: bundle exec jekyll build --baseurl "${BASE_PATH}"
        env:
          JEKYLL_ENV: production
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # So that .md links (README, docs) resolve on the published site
      # (Jekyll outputs .html only; we duplicate so .md URL serves the same HTML)
      - name: Expose all pages at .md URLs for Pages
        run: |
          set -euo pipefail
          find _site -name '*.html' -type f | while read -r f; do
            md="${f%.html}.md"
            cp "$f" "$md"
          done

      # Remove links to scripts/paths not published on GH Pages so users don't get 404s
      - name: Strip links to unpublished paths
        run: ruby .github/scripts/strip_unpublished_links.rb

      # Kramdown gives headings with leading emoji id="-section"; TOC links use #section — normalise so fragments work
      - name: Normalise heading IDs (strip leading hyphen)
        run: ruby .github/scripts/normalise_heading_ids.rb

      # Issue #272: the structural checks below assert files exist; this
      # asserts what those files *execute*. The Mermaid securityLevel and CDN
      # SRI hash were only ever validated on the source include
      # (_includes/head-custom.html), so a bump that loosened `strict` or
      # dropped `integrity` in the served HTML passed every test and every
      # step here. Runs after the build, before the artifact is uploaded, so
      # an unhardened site fails the deploy rather than shipping.
      - name: Install deno
        # denoland/setup-deno@v2.0.4
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version-file: .deno-version

      - name: Assert Mermaid hardening in the built site
        run: |
          set -euo pipefail
          deno run --frozen --lock=worker/deno/deno.lock \
            --allow-read --allow-env \
            worker/deno/mod.ts check-mermaid-built-output --site-dir _site

      - name: Verify build output
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          echo "base_path=${BASE_PATH}"
          ls -la _site/
          # Issue #2315: explicit if/else instead of `A && B || C` so
          # SC2015 is no longer flagged by actionlint's bundled linter,
          # and the logic stays unambiguous if B becomes fallible later.
          if test -f _site/index.html; then
            echo "index.html present"
          else
            echo "ERROR: no index.html in _site"; exit 1
          fi
          if test -f _site/README.html; then
            echo "README.html present"
          else
            echo "ERROR: README.html missing in _site"; exit 1
          fi
          if test -f _site/SECURITY.md; then
            echo "SECURITY.md present (link target for Security)"
          else
            echo "ERROR: SECURITY.md missing in _site"; exit 1
          fi
          if test -f _site/AGENTS.md; then
            echo "AGENTS.md present (link target for AGENTS)"
          else
            echo "ERROR: AGENTS.md missing in _site"; exit 1
          fi
          if test -f _site/docs/OVERVIEW.html; then
            echo "docs built (HTML)"
          elif test -f _site/docs/OVERVIEW.md; then
            echo "docs present (markdown fallback)"
          else
            echo "ERROR: docs not in build"
            echo "_site/docs contents:"
            ls -la _site/docs/ 2>/dev/null || true
            exit 1
          fi

      - name: Upload artifact
        # actions/upload-pages-artifact@v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: github-pages
          path: ./_site
          # Issue #4404 (GHA-SECRETS-007): the deploy job consumes this within
          # minutes; nothing needs the build downloadable for the 90-day default.
          retention-days: 7

  # Issue #2521: automated accessibility (a11y) baseline for the published
  # site. The Jekyll site is the product-facing landing page, so colour-
  # contrast, heading-order, alt-text, and landmark regressions introduced by
  # a layout or theme change should be caught structurally on every change —
  # the same way markdown-lint already guards content structure. This runs as
  # its own job with read-only token capability (Rule of Two, Issue #2382): it
  # never touches the Pages OIDC token held by `build`, so a hijacked npm
  # dependency cannot reach the deployment credential. It downloads the exact
  # artifact `build` published so it scans the bytes that ship. Reported as a
  # non-blocking baseline (`|| true`) for now; promote to a hard gate once the
  # existing pages pass clean.
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
    steps:
      - name: Download built site artifact
        # actions/download-artifact@v8.0.1 (Node 24 runner; v5 ran on the
        # deprecated Node 20 runtime — Issue #2889)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: github-pages
          path: pages-artifact

      - name: Extract site
        run: |
          set -euo pipefail
          mkdir -p _site
          # upload-pages-artifact packs the site into a single artifact.tar
          tar -xf pages-artifact/artifact.tar -C _site

      - name: Accessibility check (pa11y-ci, non-blocking baseline)
        run: |
          set -euo pipefail
          # Install global CLIs into a user-writable prefix. The default
          # /usr/local prefix on the ubuntu-24.04 runner image is no longer
          # writable by the runner user, so npm's man-page symlink into
          # /usr/local/share/man/man1 fails with EACCES (Issue #2645).
          npm config set prefix "$HOME/.npm-global"
          export PATH="$HOME/.npm-global/bin:$PATH"
          # Issue #3642: exact version pins keep both installs inside the
          # 24h dependency quarantine (the `renovate.json` custom manager
          # bumps these pins under `minimumReleaseAge`). `http-server` also
          # takes `--ignore-scripts`; `pa11y-ci` cannot, because its
          # puppeteer dependency downloads the browser from a postinstall
          # script and the check would silently find nothing without it.
          npm install -g --ignore-scripts http-server@14.1.1
          npm install -g pa11y-ci@3.1.0
          http-server _site -p 8080 -s &
          server_pid=$!
          # Wait for the server with a plain readiness loop rather than a
          # `npx --yes wait-on` fetch, which pulled an unpinned package at
          # run time (Issue #3642). Fail loud if the server never answers.
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/index.html; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::http-server did not serve /index.html within 30s"
            kill "$server_pid" 2>/dev/null || true
            exit 1
          fi
          # No jekyll-sitemap plugin is configured, so derive the URL list
          # from the generated *.html files rather than crawling a sitemap.
          mapfile -t urls < <(find _site -name '*.html' -type f \
            | sed 's#^_site#http://localhost:8080#')
          echo "Running pa11y-ci against ${#urls[@]} page(s)"
          # Non-blocking baseline (Issue #2521): report without failing the
          # build. Drop the `|| true` to make a11y a hard gate. Guard the
          # array expansion (Issue #3080) so set -u does not abort on an
          # empty url list.
          pa11y-ci --concurrency 4 "${urls[@]+"${urls[@]}"}" || true
          kill "$server_pid" 2>/dev/null || true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    # OIDC token + Pages publish capability scoped to this job only (Issue #2969)
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages@v5.0.0
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
