name: Milestone pre-PR validation
on:
  push:
    branches: [codex/validate-milestones-106-111]
permissions:
  contents: read
concurrency:
  group: milestone-pre-pr-validation-${{ github.sha }}
  cancel-in-progress: false
jobs:
  diagnostic:
    name: Diagnose baseline subprocess environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6effe8f3b2e261c89a22a2ea10e25c88c911ba00
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version-file: .deno-version
      - name: Record binary and trace entrypoint tests
        run: |
          set -euo pipefail
          command -v deno
          sha256sum "$(command -v deno)"
          deno --version
          sudo apt-get update -qq
          sudo apt-get install -y strace
          cd worker/deno
          strace -f -e trace=unlink,unlinkat,rename,renameat,renameat2,execve -o /tmp/entrypoint.trace deno task test tests/run_entrypoint_test.ts < /dev/null
      - name: Inspect tool state and trace
        if: always()
        run: |
          command -v deno || true
          ls -l /opt/hostedtoolcache/deno/2.9.6/x64 || true
          deno --version || true
          sha256sum /opt/hostedtoolcache/deno/2.9.6/x64/deno || true
          grep -E '(/deno|deno upgrade|deno clean)' /tmp/entrypoint.trace | tail -150 || true
          git status --short
