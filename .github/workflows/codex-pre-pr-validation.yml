name: Milestone pre-PR validation
on:
  push:
    branches: [codex/validate-milestones-106-111]
permissions:
  contents: read
concurrency:
  group: milestone-pre-pr-validation-${{ github.sha }}
  cancel-in-progress: false
jobs:
  full-quality:
    name: Full quality (milestone 106)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source revision
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fd73ab22322f982c2e0ce8c29973b445c6f978ce
          fetch-depth: 0
          persist-credentials: false
      - name: Install repository Deno version
        # denoland/setup-deno@v2.0.5
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version-file: .deno-version
      - name: Install repository Node version
        # actions/setup-node@v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Install pinned quality tools
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts markdownlint-cli2@0.23.2
          pipx install semgrep==1.173.0
          command -v pwsh
      - name: Run unchanged repository quality gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./quality.sh < /dev/null
