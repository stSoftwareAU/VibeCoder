<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | default: site.github.repository_name | escape }}{% endif %}</title>
  {% if page.page_icon %}{% capture favicon_svg %}<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">{{ page.page_icon }}</text></svg>{% endcapture %}
  <link rel="icon" href="data:image/svg+xml,{{ favicon_svg | uri_escape }}">
  {% else %}
  <link rel="icon" href="{{ site.baseurl }}/assets/favicon.svg" type="image/svg+xml">
  {% endif %}
  {% include head-custom.html %}
</head>
<body>
  <main class="wrapper">
    <section>
      {{ content }}
    </section>
    <footer class="site-footer">
      <a href="{{ site.baseurl }}/">← Main README</a>
    </footer>
  </main>
</body>
</html>
